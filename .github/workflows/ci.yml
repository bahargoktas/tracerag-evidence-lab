name: Test and benchmark
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Validate dataset
        run: python -m tracerag.cli check-data
      - name: Unit tests
        run: pytest -q
      - name: Evaluate held-out queries
        run: |
          python -m tracerag.cli evaluate --split test --out reports
          python -m tracerag.cli evaluate --split challenge --out reports/challenge
      - name: Upload benchmark report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: tracerag-report
          path: reports/
