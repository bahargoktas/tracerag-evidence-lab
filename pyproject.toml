[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tracerag-evidence-lab"
version = "0.1.0"
description = "Offline RAG retrieval benchmarking and extractive evidence auditing"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = []
dependencies = [
  "numpy>=1.24,<3",
  "scikit-learn>=1.3,<2",
  "matplotlib>=3.7,<4",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<10"]

[project.scripts]
tracerag = "tracerag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
